# istio-like-app이 런타임에 K8s API로 ConfigMap을 조회하기 위한 권한 (istiod가 가진 권한의 축소판)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cm-reader
  labels:
    app: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cm-reader
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cm-reader
  labels:
    app: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cm-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cm-reader
